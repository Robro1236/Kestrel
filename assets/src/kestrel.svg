<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0f5e57"/>
  <g id="bird" transform="translate(0 40)" fill="none" stroke="#f5f2ec" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- far wing: tucks behind the head and the near wing -->
    <path d="M594 375 L340 150 C345 245 380 315 430 371"/>
    <!-- near wing: one shape from shoulder to pointed tip and back into the tail -->
    <path d="M560 460 L180 200 C190 340 300 470 520 555"/>
    <!-- nape, crown, forehead -->
    <path d="M560 460 C585 370 630 300 700 295 C760 292 798 320 810 356"/>
    <!-- hooked falcon beak: upper edge to a downturned tip, lower edge back to the throat -->
    <path d="M810 356 C850 348 880 376 878 424 C862 408 836 402 806 404"/>
    <!-- eye -->
    <circle cx="740" cy="366" r="20" fill="#f5f2ec" stroke="none"/>
    <!-- throat, chest, belly -->
    <path d="M806 404 C800 520 730 620 610 680"/>
    <!-- long tail -->
    <path d="M520 555 C440 620 340 680 250 740"/>
    <path d="M250 740 L540 688"/>
  </g>
</svg>
